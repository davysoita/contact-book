<!DOCTYPE html>
<html>

<head>
    <title>Edit Contact</title>
</head>

<body>

    <h1>Edit Contact</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Update Contact
        </button>

    </form>

    <br>

    <a href="{% url 'contact_detail' contact.id %}">
        Cancel
    </a>

</body>

</html>
