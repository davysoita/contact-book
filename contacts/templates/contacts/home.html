<!DOCTYPE html>
<html>
<head>
    <title>Contact Book</title>
</head>

<body>

    <h1>My Contact Book</h1>

    {% if contacts %}

        <table border="1">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Address</th>
                </tr>
            </thead>

            <tbody>

                {% for contact in contacts %}

                    <tr>
                        <td>{{ contact.first_name }}</td>
                        <td>{{ contact.last_name }}</td>
                        <td>{{ contact.phone_number }}</td>
                        <td>{{ contact.email }}</td>
                        <td>{{ contact.address }}</td>
                    </tr>

                {% endfor %}

            </tbody>
        </table>

    {% else %}

        <p>No contacts found.</p>

    {% endif %}

</body>
</html>
