<!DOCTYPE html>
<html>

<head>
    <title>Delete Contact</title>
</head>

<body>

    <h1>Delete Contact</h1>

    <p>
        Are you sure you want to delete
        <strong>
            {{ contact.first_name }}
            {{ contact.last_name }}
        </strong>?
    </p>

    <p>
        This action cannot be undone.
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <br>

    <a href="{% url 'contact_detail' contact.id %}">
        Cancel
    </a>


    <a href="{% url 'edit_contact' contact.id %}">
    Edit Contact
</a>

<br><br>

<a href="{% url 'delete_contact' contact.id %}">
    Delete Contact
</a>

<br><br>

<a href="{% url 'home' %}">
    Back to Contacts
</a>
</body>

</html>
